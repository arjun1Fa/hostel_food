<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Production-grade hostel dining management, daily menus, midnight cutoff pre-booking, portion prep sheets, and consumption billing.">

  <!-- PWA & Theme Colors -->
  <meta name="theme-color" content="#133E31">
  <meta name="background-color" content="#FBF9F5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hostel Dining">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hostel Dining — Meal Pre-Booking & Management</title>
  <link rel="manifest" href="manifest.json">

  <!-- Inline Loading & Update Notification Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FBF9F5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #FBF9F5;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #EBF3F0;
      border-top: 4px solid #133E31;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 20px;
      color: #133E31;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .loading-subtitle {
      margin-top: 6px;
      color: #53675E;
      font-size: 13px;
    }
    #update-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #133E31;
      color: #FFFFFF;
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(19, 62, 49, 0.25);
      z-index: 10000;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }
    #update-toast button {
      background: #E07A5F;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    @keyframes slideIn {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Brand Splash Loading Screen -->
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-title">Hostel Dining</div>
    <div class="loading-subtitle">Preparing kitchen & meal schedules...</div>
  </div>

  <!-- PWA Update Available Toast -->
  <div id="update-toast" style="display: none;">
    <span>A new version of Hostel Dining is available!</span>
    <button id="reload-btn">Update Now</button>
  </div>

  <script>
    // Remove splash screen once Flutter renders
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });

    // PWA Service Worker Registration & Update Detection
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').then(function (registration) {
          registration.addEventListener('updatefound', function () {
            const installingWorker = registration.installing;
            installingWorker.addEventListener('statechange', function () {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // Show update banner
                const toast = document.getElementById('update-toast');
                if (toast) {
                  toast.style.display = 'flex';
                  document.getElementById('reload-btn').addEventListener('click', function () {
                    installingWorker.postMessage({ action: 'skipWaiting' });
                    window.location.reload();
                  });
                }
              }
            });
          });
        }).catch(function (error) {
          console.log('PWA ServiceWorker registration failed:', error);
        });
      });

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
